[package]
name = "solana_transfers"
version = "0.0.1"
edition = "2021"

[lib]
name = "substreams"
crate-type = ["cdylib"]

[dependencies]
bs58 = "0.5"
buffa = "0.9.2"
buffa-types = "0.9.2"
substreams = "0.8.0"
substreams-solana = "0.16.0"

[build-dependencies]
anyhow = "1"
regex = "1.8"

[profile.release]
lto = true
opt-level = 's'
strip = "debuginfo"
